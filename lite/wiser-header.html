<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
<title>WISER Playbooks</title>
<style>
  /* The comp's titlebar, as a real surface (WISER Playbooks × Cap Chew
     poster, Zone B window chrome). The remote app renders in a
     WebContentsView below this strip; everything here is drag region. */
  :root {
    --paper: #f1ede4;
    --rule: #dcd6c8;
    --ink-soft: #4b463c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    -webkit-app-region: drag;
    user-select: none;
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .bar {
    height: 38px;
    display: flex;
    align-items: center;
    /* clear the macOS traffic lights (hiddenInset) */
    padding: 0 14px 0 84px;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3em;
    color: var(--ink-soft);
  }
  .stamp {
    margin-left: auto;
    display: flex;
    align-items: center;
  }
  .stamp svg { width: 22px; height: 13px; display: block; }
</style>
</head>
<body>
  <div class="bar">
    <span class="wordmark">WISER&nbsp;&nbsp;PLAYBOOKS</span>
    <span class="stamp" aria-hidden="true">
      <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="21" rx="13" ry="1.4" fill="#0a84ff" opacity=".18"/>
        <path d="M4 12c0-4.5 2-7 5-8h18c3.3 0 6 2.7 6 6s-2.7 6-6 6H9c-3 0-5-1.5-5-4z" fill="#1e88e5"/>
        <path d="M33 10c2 .5 3.5 1.5 3.5 3s-1 2-2.5 2" stroke="#e83060" stroke-width="1.3" fill="none" stroke-linecap="round"/>
        <path d="M33 11c1.5.3 2.8 1 3 2" stroke="#ffc107" stroke-width="1" fill="none" stroke-linecap="round"/>
      </svg>
    </span>
  </div>
</body>
</html>
