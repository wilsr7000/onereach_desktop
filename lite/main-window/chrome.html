<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>WISER</title>
    <link rel="stylesheet" href="./signature.css" />
    <link rel="stylesheet" href="./chrome.css" />
  </head>
  <body>
    <!-- Tab bar at the top -- 48px high, defined in chrome.css
         (must match CHROME_HEIGHT_PX in types.ts). -->
    <div id="tab-bar" class="tab-bar" role="tablist" aria-label="Open agent tabs">
      <!--
        Open Spaces button -- ported verbatim from the full app's
        `#black-hole-button` (tabbed-browser.html). Dark-blue gradient
        circle with the OR logo masked on top. Click opens the Spaces
        window via the same single-instance factory the Tools menu uses.
        Sits in the upper-left so it reads as a workspace-level entry
        point, peer to Home, not buried in a body button row.
      -->
      <button
        id="spaces-or-button"
        class="spaces-or-button"
        type="button"
        title="Open Spaces"
        aria-label="Open Spaces"
      ></button>
      <button
        id="home-pill"
        class="tab-pill home-pill active"
        type="button"
        role="tab"
        aria-selected="true"
        title="Home"
      >
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path
            d="M12 3 L3 12 H6 V20 H10 V14 H14 V20 H18 V12 H21 Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
        </svg>
        <span class="tab-pill-label">Home</span>
      </button>
      <!--
        Refresh the active view — reloads the foregrounded agent tab, or
        the Home feed when Home is active. Sits between Home and the tab
        list so it reads as a navigation control. Click handler in
        chrome.ts -> window.lite.mainWindow.reloadActive().
      -->
      <button
        id="refresh-active-btn"
        class="tab-bar-refresh-btn"
        type="button"
        title="Refresh current tab"
        aria-label="Refresh current tab"
      >
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path
            d="M21 12a9 9 0 1 1-2.64-6.36"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M21 4v5h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <div id="tab-list" class="tab-list" aria-live="polite"></div>
    </div>

    <!-- Home view: the chat surface IS the Home tab. When the user
         opens an IDW, its WebContentsView covers this region; closing
         the IDW returns the user here. The chat handles sign-in inline
         (no separate boot screen), then sits with the welcome + recent
         activity digest for the life of the window. -->
    <main id="home-view" class="home-view" role="main">
      <!-- Decorative orb mark -- partially off-screen bottom-right,
           heavily faded. Pure CSS (no asset to ship); pointer-events
           none so it never intercepts clicks; aria-hidden because
           it carries no semantic meaning. -->
      <div class="home-orb" aria-hidden="true"></div>

      <div class="home-chat">
        <header class="home-chat-header">
          <div class="boot-chat-logo" aria-hidden="true">
            <span class="boot-chat-logo-glyph">iDW</span>
            <span class="boot-chat-logo-tag">Lite</span>
          </div>
          <h1 class="boot-chat-app-name">Onereach.ai</h1>
        </header>

        <section
          class="boot-chat-thread"
          id="boot-chat-thread"
          aria-live="polite"
          aria-label="Workspace conversation"
        >
          <!-- Bubbles injected by chrome.ts via runBootChat() -->
        </section>

        <section
          class="boot-chat-actions"
          id="boot-chat-actions"
          hidden
          aria-label="Actions"
        >
          <!-- Sign-in / Retry button injected by chrome.ts when the
               chat reaches a state that needs user input. The settled
               (signed-in) state has no action row. -->
        </section>

        <div class="home-chat-shortcuts">
          <button id="open-store-btn" class="btn-secondary" type="button">Browse OAGI Store</button>
          <button id="manage-agents-btn" class="btn-secondary" type="button">Manage Agents</button>
          <!-- Always-available Sign-in CTA. Visible when no edison session
               exists; hidden once signed in (the Sign-out button takes
               its place). The boot-chat in the home view drives the
               primary flow, but this button gives the user an explicit
               escape hatch when an IDW tab is foregrounded and the chat
               is hidden, or when their session expires mid-session. -->
          <button id="signin-btn" class="btn-primary" type="button" hidden>Sign in to OneReach</button>
          <button id="signout-btn" class="btn-secondary" type="button" hidden>Sign out</button>
        </div>
      </div>
    </main>

    <!-- Fixed bottom-right version badge: visible on the home view
         (when no agent tab is foregrounded). Tab views in the main
         process cover this region when active, so the badge only
         appears on the home view -- matches the user's intent of
         "subtle corner indicator, not page chrome." -->
    <div class="version-badge" id="version" aria-label="App version">v0.0.0</div>

    <!-- External script (not inline) so the strict CSP `script-src 'self'`
         allows execution. Source: lite/main-window/chrome.ts -> bundled by
         esbuild to dist-lite/build/chrome.js. -->
    <script src="./chrome.js"></script>
  </body>
</html>
