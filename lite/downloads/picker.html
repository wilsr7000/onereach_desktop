<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Save to Space</title>
    <link rel="stylesheet" href="./signature.css" />
    <link rel="stylesheet" href="./download-picker.css" />
  </head>
  <body>
    <main class="picker">
      <header class="picker-header">
        <h1 class="picker-title">Save to Space</h1>
        <p class="picker-sub" id="picker-sub">Captured download</p>
      </header>

      <!-- File summary card. Renderer fills in the kind / filename / size. -->
      <section class="picker-file" id="picker-file">
        <div class="picker-file-kind" id="picker-file-kind" aria-hidden="true"></div>
        <div class="picker-file-meta">
          <div class="picker-file-name" id="picker-file-name">Loading…</div>
          <div class="picker-file-meta-line" id="picker-file-meta-line"></div>
        </div>
      </section>

      <!-- Space search + list. -->
      <section class="picker-spaces">
        <label class="picker-search-label" for="picker-search">
          Pick a destination
        </label>
        <input
          type="search"
          id="picker-search"
          class="picker-search"
          placeholder="Search spaces…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Filter spaces by name"
        />
        <div id="picker-list" class="picker-list" role="listbox" aria-label="Spaces">
          <div class="picker-list-empty" id="picker-list-empty">Loading spaces…</div>
        </div>
      </section>

      <!-- Inline error block (e.g. upload failed). -->
      <div id="picker-error" class="picker-error" hidden></div>

      <!-- Bottom action bar. -->
      <footer class="picker-actions">
        <button type="button" id="picker-cancel" class="picker-btn picker-btn-cancel">
          Cancel
        </button>
        <button
          type="button"
          id="picker-save"
          class="picker-btn picker-btn-save"
          disabled
        >
          Save
        </button>
      </footer>
    </main>

    <script src="./download-picker.js"></script>
  </body>
</html>
