<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 24" fill="none">
  <!-- Cap Chew icon: simplified blue bullet/capsule with yellow accent -->
  <!-- Drop shadow -->
  <ellipse cx="20" cy="22" rx="14" ry="1.5" fill="#0a84ff" opacity="0.15"/>
  <!-- Main bullet body -->
  <path d="M4 12c0-4.5 2-7 5-8h18c3.3 0 6 2.7 6 6s-2.7 6-6 6H9c-3 0-5-1.5-5-4z" fill="url(#cg)"/>
  <!-- Tip point -->
  <path d="M4 12c0-3.5 1.5-6 4-7.5L10 4c-2 1.5-3.5 4-3.5 7s1 4.5 2.5 5.5l-1 .5C5.5 16 4 14.5 4 12z" fill="#1050a0"/>
  <!-- Horizontal stripes -->
  <rect x="10" y="7.5" width="18" height="1.8" rx="0.9" fill="#5ab8ff" opacity="0.5"/>
  <rect x="11" y="11" width="16" height="1.5" rx="0.75" fill="#5ab8ff" opacity="0.35"/>
  <rect x="10" y="14.5" width="18" height="1.4" rx="0.7" fill="#5ab8ff" opacity="0.25"/>
  <!-- Rim/base highlight -->
  <ellipse cx="27" cy="12" rx="1.5" ry="5" fill="#1a5fbb" opacity="0.4"/>
  <!-- Flowing trail elements -->
  <path d="M33 10c2 .5 3.5 1.5 3.5 3s-1 2-2.5 2" stroke="#e83060" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M33 11c1.5.3 2.8 1 3 2" stroke="#ffc107" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M33 13c1 .5 2 .3 2.5-.5" stroke="#2196f3" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Yellow outline accent (like the original) -->
  <path d="M9 4.5c-3 1-5 3.5-5 7.5 0 3 2 4.5 5 4.5h18c3.3 0 6-2.7 6-6s-2.7-6-6-6H9z" stroke="#c4a052" stroke-width="0.6" fill="none" opacity="0.6"/>
  <defs>
    <linearGradient id="cg" x1="4" y1="6" x2="33" y2="18">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="30%" stop-color="#2196f3"/>
      <stop offset="70%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
</svg>
